                    {/* 参観予約セクション */}

        // 校舎詳細カードコンポーネント - 実際の写真を使用
        function SchoolDetailCard({ school, schoolInfo, currentLang, onImageClick }) {
            const [expanded, setExpanded] = React.useState(false);
            
            const handleExpandClick = () => {
                setExpanded(!expanded);
            };
            
            return (
                <Card sx={{ mb: 4, overflow: 'visible' }}>
                    <CardContent>
                        <Typography variant="h4" component="h2" gutterBottom sx={{ color: '#d4af37', fontWeight: 'bold' }}>
                            {schoolInfo.name}
                        </Typography>
                        
                        <Typography variant="body1" sx={{ display: 'flex', alignItems: 'center', mb: 1 }}>
                            <span className="material-icons" style={{ marginRight: '8px', color: '#666' }}>place</span>
                            {schoolInfo.address}
                        </Typography>
                        <Typography variant="body1" sx={{ display: 'flex', alignItems: 'center', mb: 3 }}>
                            <span className="material-icons" style={{ marginRight: '8px', color: '#666' }}>phone</span>
                            {schoolInfo.phone}
                        </Typography>
                        
                        {/* 写真ギャラリー */}
                        <Typography variant="h6" gutterBottom sx={{ mt: 3 }}>
                            {schoolInfo.photoGallery}
                        </Typography>
                        
                        <ImageList cols={school.images.length > 2 ? 3 : (school.images.length > 1 ? 2 : 1)} gap={8}>
                            {school.images.map((img, index) => (
                                <ImageListItem 
                                    key={index}
                                    onClick={() => onImageClick(img, school.imageDescriptions[currentLang][index])}
                                    sx={{ 
                                        cursor: 'pointer',
                                        '&:hover': {
                                            opacity: 0.9,
                                            transform: 'scale(1.02)',
                                            transition: 'all 0.3s ease'
                                        }
                                    }}
                                >
                                    <img
                                        src={img}
                                        alt={school.imageDescriptions[currentLang][index]}
                                        loading="lazy"
                                        style={{ 
                                            height: '200px', 
                                            width: '100%', 
                                            objectFit: 'cover', 
                                            borderRadius: '4px' 
                                        }}
                                    />
                                    <Typography variant="caption" sx={{ mt: 1, display: 'block', textAlign: 'center' }}>
                                        {school.imageDescriptions[currentLang][index]}
                                    </Typography>
                                </ImageListItem>
                            ))}
                        </ImageList>
                        
                        {/* 特徴 */}
                        <Typography variant="h6" gutterBottom sx={{ mt: 4 }}>
                            {schoolInfo.features}
                        </Typography>
                        <Grid container spacing={2} sx={{ mb: 3 }}>
                            <Grid item xs={12} sm={6}>
                                <Box sx={{ display: 'flex', alignItems: 'center' }}>
                                    <span className="material-icons" style={{ marginRight: '8px', color: '#d4af37' }}>check_circle</span>
                                    <Typography variant="body2">{schoolInfo.feature1}</Typography>
                                </Box>
                            </Grid>
                            <Grid item xs={12} sm={6}>
                                <Box sx={{ display: 'flex', alignItems: 'center' }}>
                                    <span className="material-icons" style={{ marginRight: '8px', color: '#d4af37' }}>check_circle</span>
                                    <Typography variant="body2">{schoolInfo.feature2}</Typography>
                                </Box>
                            </Grid>
                            <Grid item xs={12} sm={6}>
                                <Box sx={{ display: 'flex', alignItems: 'center' }}>
                                    <span className="material-icons" style={{ marginRight: '8px', color: '#d4af37' }}>check_circle</span>
                                    <Typography variant="body2">{schoolInfo.feature3}</Typography>
                                </Box>
                            </Grid>
                            <Grid item xs={12} sm={6}>
                                <Box sx={{ display: 'flex', alignItems: 'center' }}>
                                    <span className="material-icons" style={{ marginRight: '8px', color: '#d4af37' }}>check_circle</span>
                                    <Typography variant="body2">{schoolInfo.feature4}</Typography>
                                </Box>
                            </Grid>
                        </Grid>
                        
                        {/* 営業時間 */}
                        <Typography variant="h6" gutterBottom>
                            {schoolInfo.hours}
                        </Typography>
                        <Box sx={{ mb: 3 }}>
                            <Typography variant="body2" gutterBottom>
                                {schoolInfo.weekdays}
                            </Typography>
                            <Typography variant="body2">
                                {schoolInfo.weekends}
                            </Typography>
                        </Box>
                        
                        {/* アクセス */}
                        <Typography variant="h6" gutterBottom>
                            {schoolInfo.access}
                        </Typography>
                        <Typography variant="body2" sx={{ mb: 2 }}>
                            {schoolInfo.directions}
                        </Typography>
                        
                        <Button 
                            variant="outlined" 
                            size="small"
                            endIcon={<span className="material-icons">expand_more</span>}
                            onClick={handleExpandClick}
                            sx={{ 
                                borderColor: '#d4af37',
                                color: '#d4af37',
                                '&:hover': {
                                    borderColor: '#b8860b',
                                    backgroundColor: 'rgba(212, 175, 55, 0.1)'
                                }
                            }}
                        >
                            {schoolInfo.viewMap}
                        </Button>
                    </CardContent>
                    
                    {/* 地図（展開可能） */}
                    <Box sx={{ 
                        height: expanded ? 'auto' : 0, 
                        overflow: 'hidden',
                        transition: 'height 0.3s ease'
                    }}>
                        <Box sx={{ p: 2 }}>
                            <iframe 
                                src={school.mapUrl} 
                                width="100%" 
                                height="300" 
                                style={{ border: 0 }} 
                                allowFullScreen="" 
                                loading="lazy"
                                title={`Map to ${schoolInfo.name}`}
                            ></iframe>
                        </Box>
                    </Box>
                </Card>
            );
        }
        
        // エラーバウンダリ
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false };
            }
            
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            
            componentDidCatch(error, errorInfo) {
                console.error("Error caught by boundary:", error, errorInfo);
            }
            
            render() {
                if (this.state.hasError) {
                    return (
                        <Box sx={{ 
                            p: 3, 
                            textAlign: 'center',
                            height: '100vh',
                            display: 'flex',
                            flexDirection: 'column',
                            justifyContent: 'center',
                            alignItems: 'center'
                        }}>
                            <Typography variant="h4" color="error" gutterBottom>
                                Something went wrong
                            </Typography>
                            <Button 
                                variant="contained" 
                                onClick={() => window.location.reload()}
                            >
                                Reload Page
                            </Button>
                        </Box>
                    );
                }
                
                return this.props.children;
            }
        }
        
        // アプリケーションのレンダリング
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
