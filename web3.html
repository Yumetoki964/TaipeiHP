        .slide-up {
            animation: slideUp 0.8s ease-out;

                    neihu: {

                        feature4: 'Advanced digital learning tools',

                        weekends: 'Saturday & Sunday: 9:00 - 18:00',

        // 校舎のモックデータ
        const schoolsData = [
            {
                id: 'minghu',
                images: [
                    'https://source.unsplash.com/random/800x500/?classroom',
                    'https://source.unsplash.com/random/800x500/?study',
                    'https://source.unsplash.com/random/800x500/?school'
                ],
                mapUrl: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3614.1738858325117!2d121.596945!3d25.070378!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442ac7bce656dbb%3A0x73bc5379ce8a5ab4!2sNo.%208%2C%20Alley%2021%2C%20Lane%20189%2C%20Section%203%2C%20Kangning%20Rd%2C%20Neihu%20District%2C%20Taipei%20City%2C%20Taiwan%20114!5e0!3m2!1sen!2s!4v1637903982548!5m2!1sen!2s'
            },
            {
                id: 'neihu',
                images: [
                    'https://source.unsplash.com/random/800x500/?learning',
                    'https://source.unsplash.com/random/800x500/?education',
                    'https://source.unsplash.com/random/800x500/?teaching'
                ],
                mapUrl: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3614.3851231147024!2d121.59364!3d25.064722!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442ac1a46bc3179%3A0xaa26331addac7f6!2sNo.%20351%2C%20Section%202%2C%20Neihu%20Rd%2C%20Neihu%20District%2C%20Taipei%20City%2C%20Taiwan%20114!5e0!3m2!1sen!2s!4v1637904102548!5m2!1sen!2s'
            }
        ];
        
        // メインアプリケーション
        function App() {
            const theme = useTheme();
            const isMobile = useMediaQuery(theme.breakpoints.down('md'));
            const [currentLang, setCurrentLang] = React.useState('zh');
            const [langAnchor, setLangAnchor] = React.useState(null);
            const [drawerOpen, setDrawerOpen] = React.useState(false);
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState(null);
            const [visitDialogOpen, setVisitDialogOpen] = React.useState(false);
            const [currentTab, setCurrentTab] = React.useState(0);
            const [currentImageIndex, setCurrentImageIndex] = React.useState([0, 0]);
            
            // 言語メニュー
            const handleLangClick = (event) => {
                setLangAnchor(event.currentTarget);
            };
            
            const handleLangClose = () => {
                setLangAnchor(null);
            };
            
            const changeLanguage = (langCode) => {
                setLoading(true);
                setTimeout(() => {
                    setCurrentLang(langCode);
                    setLangAnchor(null);
                    setLoading(false);
                }, 300);
            };
            
            // ハンバーガーメニュー
            const toggleDrawer = (open) => (event) => {
                if (event.type === 'keydown' && (event.key === 'Tab' || event.key === 'Shift')) {
                    return;
                }
                setDrawerOpen(open);
            };
            
            // 校舎のタブ切り替え
            const handleTabChange = (event, newValue) => {
                setCurrentTab(newValue);
            };
            
            // 画像スライダー
            const handleNextImage = (schoolIndex) => {
                setCurrentImageIndex(prev => {
                    const newIndexes = [...prev];
                    newIndexes[schoolIndex] = (newIndexes[schoolIndex] + 1) % schoolsData[schoolIndex].images.length;
                    return newIndexes;
                });
            };
            
            const handlePrevImage = (schoolIndex) => {
                setCurrentImageIndex(prev => {
                    const newIndexes = [...prev];
                    newIndexes[schoolIndex] = (newIndexes[schoolIndex] - 1 + schoolsData[schoolIndex].images.length) % schoolsData[schoolIndex].images.length;
                    return newIndexes;
                });
            };
            
            // 予約ダイアログ
            const handleVisitDialogOpen = () => {
                setVisitDialogOpen(true);
            };
            
            const handleVisitDialogClose = () => {
                setVisitDialogOpen(false);
            };
            
            const t = translations[currentLang];
            
            // エラーハンドリング
            React.useEffect(() => {
                if (error) {
                    setTimeout(() => setError(null), 3000);
                }
            }, [error]);
            
            return (
                <React.Fragment>
                    <CssBaseline />
                    
                    {/* エラー表示 */}
                    <Snackbar 
                        open={error !== null} 
                        autoHideDuration={3000} 
                        onClose={() => setError(null)}
                        anchorOrigin={{ vertical: 'top', horizontal: 'center' }}
                    >
                        <Alert severity="error">{error}</Alert>
                    </Snackbar>
                    
                    {/* ローディング表示 */}
                    {loading && (
                        <Box sx={{ 
                            position: 'fixed', 
                            top: 0, 
                            left: 0, 
                            width: '100%', 
                            height: '100%', 
                            display: 'flex', 
                            alignItems: 'center', 
                            justifyContent: 'center',
                            backgroundColor: 'rgba(255,255,255,0.7)',
                            zIndex: 9999
                        }}>
                            <CircularProgress color="primary" />
                        </Box>
                    )}
                    
                    {/* ヘッダー */}
                    <AppBar position="sticky" sx={{ backgroundColor: '#1a1a1a' }}>
                        <Toolbar>
                            <Box sx={{ display: 'flex', alignItems: 'center', flexGrow: 1 }}>
                                <Typography variant="h6" component="div" sx={{ color: '#d4af37', fontWeight: 'bold' }}>
                                    夢時
                                </Typography>
                            </Box>
                            
                            {isMobile ? (
                                <IconButton
                                    edge="end"
                                    color="inherit"
                                    aria-label="menu"
                                    onClick={toggleDrawer(true)}
                                >
                                    <span className="material-icons">menu</span>
                                </IconButton>
                            ) : (
                                <Box sx={{ display: 'flex', alignItems: 'center' }}>
                                    <Button color="inherit" href="index.html">{t.menu.home}</Button>
                                    <Button color="inherit">{t.menu.about}</Button>
                                    <Button color="inherit">{t.menu.courses}</Button>
                                    <Button color="inherit" sx={{ borderBottom: '2px solid #d4af37' }}>{t.menu.schools}</Button>
                                    <Button color="inherit">{t.menu.teachers}</Button>
                                    <Button color="inherit">{t.menu.blog}</Button>
                                    <Button color="inherit">{t.menu.contact}</Button>
                                    
                                    <Button 
                                        color="inherit" 
                                        onClick={handleLangClick}
                                        startIcon={<span className="material-icons">language</span>}
                                    >
                                        {languages[currentLang].flag}
                                    </Button>
                                </Box>
                            )}
                            
                            {/* 言語メニュー */}
                            <Menu
                                anchorEl={langAnchor}
                                open={Boolean(langAnchor)}
                                onClose={handleLangClose}
                            >
                                {Object.values(languages).map((lang) => (
                                    <MenuItem 
                                        key={lang.code} 
                                        onClick={() => changeLanguage(lang.code)}
                                        selected={currentLang === lang.code}
                                    >
                                        {lang.flag} {lang.label}
                                    </MenuItem>
                                ))}
                            </Menu>
                            
                            {/* モバイルドロワー */}
                            <Drawer
                                anchor="right"
                                open={drawerOpen}
                                onClose={toggleDrawer(false)}
                            >
                                <Box
                                    sx={{ width: 250 }}
                                    role="presentation"
                                    onClick={toggleDrawer(false)}
                                    onKeyDown={toggleDrawer(false)}
                                >
                                    <List>
                                        <ListItem button href="index.html">
                                            <ListItemText primary={t.menu.home} />
                                        </ListItem>
                                        <ListItem button>
                                            <ListItemText primary={t.menu.about} />
                                        </ListItem>
                                        <ListItem button>
                                            <ListItemText primary={t.menu.courses} />
                                        </ListItem>
                                        <ListItem button selected>
                                            <ListItemText primary={t.menu.schools} />
                                        </ListItem>
                                        <ListItem button>
                                            <ListItemText primary={t.menu.teachers} />
                                        </ListItem>
                                        <ListItem button>
                                            <ListItemText primary={t.menu.blog} />
                                        </ListItem>
                                        <ListItem button>
                                            <ListItemText primary={t.menu.contact} />
                                        </ListItem>
                                        <Divider />
                                        <ListItem>
                                            <Typography variant="subtitle2" sx={{ mb: 1 }}>
                                                言語 / Language
                                            </Typography>
                                        </ListItem>
                                        {Object.values(languages).map((lang) => (
                                            <ListItem 
                                                button 
                                                key={lang.code} 
                                                onClick={() => changeLanguage(lang.code)}
                                                selected={currentLang === lang.code}
                                            >
                                                <ListItemText primary={`${lang.flag} ${lang.label}`} />
                                            </ListItem>
                                        ))}
                                    </List>
                                </Box>
                            </Drawer>
                        </Toolbar>
                    </AppBar>
                    
                    {/* ページヘッダー */}
                    <Box 
                        sx={{ 
                            bgcolor: '#1a1a1a', 
                            color: 'white',
                            py: { xs: 4, md: 6 }
                        }}
                    >
                        <Container maxWidth="lg">
                            <Typography 
                                variant="h3" 
                                component="h1" 
                                sx={{ 
                                    textAlign: 'center',
                                    fontWeight: 'bold',
                                    color: '#d4af37'
                                }}
                                className="fade-in"
                            >
                                {t.schools.title}
                            </Typography>
                            <Typography 
                                variant="h6" 
                                sx={{ 
                                    textAlign: 'center',
                                    mt: 2
                                }}
                                className="slide-up"
                            >
                                {t.schools.subtitle}
                            </Typography>
                        </Container>
                    </Box>
                    
                    {/* 概要セクション */}
                    <Container maxWidth="lg" sx={{ my: 6 }}>
                        <Typography variant="body1" sx={{ textAlign: 'center', mb: 6 }}>
                            {t.schools.overview}
                        </Typography>
                        
                        {/* タブセクション（モバイルビュー） */}
                        <Box sx={{ display: { xs: 'block', md: 'none' } }}>
                            <Tabs 
                                value={currentTab} 
                                onChange={handleTabChange} 
                                indicatorColor="primary"
                                textColor="primary"
                                variant="fullWidth"
                                sx={{ 
                                    mb: 3,
                                    '& .MuiTab-root': { 
                                        fontWeight: 'bold',
                                        color: '#666'
                                    },
                                    '& .Mui-selected': { 
                                        color: '#d4af37' 
                                    },
                                    '& .MuiTabs-indicator': { 
                                        backgroundColor: '#d4af37' 
                                    }
                                }}
                            >
                                <Tab label={t.schools.minghu.name} />
                                <Tab label={t.schools.neihu.name} />
                            </Tabs>
                            
                            {/* 明湖校 (モバイル) */}
                            <Box hidden={currentTab !== 0}>
                                <SchoolCard 
                                    school={schoolsData[0]}
                                    schoolInfo={t.schools.minghu}
                                    currentImageIndex={currentImageIndex[0]}
                                    onNext={() => handleNextImage(0)}
                                    onPrev={() => handlePrevImage(0)}
                                />
                            </Box>
                            
                            {/* 内湖駅前校 (モバイル) */}
                            <Box hidden={currentTab !== 1}>
                                <SchoolCard 
                                    school={schoolsData[1]}
                                    schoolInfo={t.schools.neihu}
                                    currentImageIndex={currentImageIndex[1]}
                                    onNext={() => handleNextImage(1)}
                                    onPrev={() => handlePrevImage(1)}
                                />
                            </Box>
                        </Box>
                        
                        {/* デスクトップビュー */}
                        <Box sx={{ display: { xs: 'none', md: 'block' } }}>
                            <Grid container spacing={4}>
                                <Grid item xs={12} md={6}>
                                    <SchoolCard 
                                        school={schoolsData[0]}
                                        schoolInfo={t.schools.minghu}
                                        currentImageIndex={currentImageIndex[0]}
                                        onNext={() => handleNextImage(0)}
                                        onPrev={() => handlePrevImage(0)}
                                    />
                                </Grid>

        // 校舎カードコンポーネント

                <Card sx={{ mb: 4 }}>

                    <Box sx={{ position: 'relative' }}>

                            component="img"
                            height="300"
                            image={school.images[currentImageIndex]}

                        />

                            position: 'absolute', 
                            top: 0, 
                            left: 0, 
                            right: 0,

                                onClick={onNext}

                                    backgroundColor: 'rgba(0,0,0,0.5)',
                                    '&:hover': { backgroundColor: 'rgba(0,0,0,0.7)' }
                                }}
                            >
                                <span className="material-icons">chevron_right</span>
                            </IconButton>

                        <Box sx={{ 
                            position: 'absolute', 
                            bottom: 0, 
                            left: 0, 
                            right: 0, 
                            p: 2,
                            backgroundColor: 'rgba(0,0,0,0.6)',
                            color: 'white'
                        }}>

                                {schoolInfo.name}
                            </Typography>
                        </Box>
                    </Box>
                    
                    <CardContent>
                        <Typography variant="body1" sx={{ display: 'flex', alignItems: 'center', mb: 1 }}>
                            <span className="material-icons" style={{ marginRight: '8px', color: '#666' }}>place</span>
                            {schoolInfo.address}
                        </Typography>
                        <Typography variant="body1" sx={{ display: 'flex', alignItems: 'center', mb: 3 }}>
                            <span className="material-icons" style={{ marginRight: '8px', color: '#666' }}>phone</span>
                            {schoolInfo.phone}
                        </Typography>
                        
                        {/* 特徴 */}

                            {schoolInfo.features}
                        </Typography>
                        <Grid container spacing={2} sx={{ mb: 3 }}>
                            <Grid item xs={12} sm={6}>
                                <Box sx={{ display: 'flex', alignItems: 'center' }}>
                                    <span className="material-icons" style={{ marginRight: '8px', color: '#d4af37' }}>check_circle</span>
                                    <Typography variant="body2">{schoolInfo.feature1}</Typography>
                                </Box>
                            </Grid>
                            <Grid item xs={12} sm={6}>
                                <Box sx={{ display: 'flex', alignItems: 'center' }}>
                                    <span className="material-icons" style={{ marginRight: '8px', color: '#d4af37' }}>check_circle</span>
                                    <Typography variant="body2">{schoolInfo.feature2}</Typography>
                                </Box>
                            </Grid>
                            <Grid item xs={12} sm={6}>
                                <Box sx={{ display: 'flex', alignItems: 'center' }}>

                                    <Typography variant="body2">{schoolInfo.feature3}</Typography>
                                </Box>
                            </Grid>
                            <Grid item xs={12} sm={6}>
                                <Box sx={{ display: 'flex', alignItems: 'center' }}>
                                    <span className="material-icons" style={{ marginRight: '8px', color: '#d4af37' }}>check_circle</span>
                                    <Typography variant="body2">{schoolInfo.feature4}</Typography>
                                </Box>
                            </Grid>
                        </Grid>
                        
                        {/* 営業時間 */}

                        </Typography>

                                {schoolInfo.weekdays}
                            </Typography>
                            <Typography variant="body2">

                            </Typography>
                        </Box>
                        
                        {/* アクセス */}

                        height: expanded ? 'auto' : 0,

        // エラーバウンダリ
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false };
            }
            
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            
            componentDidCatch(error, errorInfo) {
                console.error("Error caught by boundary:", error, errorInfo);
            }
            
            render() {
                if (this.state.hasError) {
                    return (
                        <Box sx={{ 
                            p: 3, 
                            textAlign: 'center',
                            height: '100vh',
                            display: 'flex',
                            flexDirection: 'column',
                            justifyContent: 'center',
                            alignItems: 'center'
                        }}>
                            <Typography variant="h4" color="error" gutterBottom>
                                Something went wrong
                            </Typography>
                            <Button 
                                variant="contained" 
                                onClick={() => window.location.reload()}
                            >
                                Reload Page
                            </Button>
                        </Box>
                    );
                }
                
                return this.props.children;
            }
        }
        
        // アプリケーションのレンダリング
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
